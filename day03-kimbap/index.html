<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 03 — 김밥 만들기 | hyejunmoon</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #faf7f2;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
            color: #333;
        }

        .back-link {
            position: fixed;
            top: 1.5rem;
            left: 1.5rem;
            color: #999;
            text-decoration: none;
            font-size: 0.9rem;
            z-index: 200;
            transition: color 0.2s;
        }
        .back-link:hover { color: #333; }

        h1 {
            font-size: 2rem;
            margin-bottom: 0.3rem;
        }

        .subtitle {
            color: #888;
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }

        /* 김밥 만드는 영역 */
        .game-container {
            width: 100%;
            max-width: 600px;
        }

        /* 김 위의 밥 + 재료 */
        .kimbap-mat {
            background: #2d5a1b;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            min-height: 160px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .mat-label {
            color: rgba(255,255,255,0.4);
            font-size: 0.8rem;
            position: absolute;
            top: 0.8rem;
            left: 1rem;
        }

        .nori {
            background: #1a3a10;
            border-radius: 8px;
            width: 100%;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            position: relative;
        }

        .rice-layer {
            background: #fff;
            border-radius: 6px;
            width: 100%;
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            flex-wrap: wrap;
            padding: 0.8rem;
        }

        .ingredient-on-rice {
            font-size: 1.8rem;
            animation: plop 0.3s ease-out;
            cursor: pointer;
            transition: transform 0.15s;
        }

        .ingredient-on-rice:hover {
            transform: scale(1.3);
        }

        @keyframes plop {
            0% { transform: scale(0) translateY(-20px); opacity: 0; }
            60% { transform: scale(1.2) translateY(0); }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }

        .empty-msg {
            color: #ccc;
            font-size: 0.9rem;
        }

        /* 재료 선택 */
        .section-title {
            font-size: 0.85rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 0.8rem;
            font-weight: 600;
        }

        .ingredients {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 0.6rem;
            margin-bottom: 2rem;
        }

        .ingredient-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.3rem;
            padding: 0.8rem 0.5rem;
            border: 2px solid #eee;
            border-radius: 10px;
            background: #fff;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
        }

        .ingredient-btn:hover {
            border-color: #ffb800;
            background: #fffbf0;
            transform: translateY(-2px);
        }

        .ingredient-btn:active {
            transform: translateY(0) scale(0.95);
        }

        .ingredient-btn .emoji {
            font-size: 1.8rem;
        }

        .ingredient-btn .name {
            font-size: 0.75rem;
            color: #666;
        }

        /* 액션 버튼들 */
        .actions {
            display: flex;
            gap: 0.8rem;
            margin-bottom: 2rem;
        }

        .btn {
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-roll {
            background: #ffb800;
            color: #fff;
            flex: 1;
        }

        .btn-roll:hover { background: #e5a600; transform: translateY(-1px); }
        .btn-roll:disabled { background: #ddd; color: #aaa; cursor: not-allowed; transform: none; }

        .btn-reset {
            background: #f0f0f0;
            color: #666;
        }

        .btn-reset:hover { background: #e5e5e5; }

        /* 완성된 김밥 */
        .result {
            display: none;
            text-align: center;
            animation: fadeUp 0.5s ease-out;
        }

        .result.show { display: block; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .reveal-img {
            width: 250px;
            max-width: 80%;
            border-radius: 12px;
            margin-bottom: 1rem;
            animation: revealPop 0.6s ease-out;
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
        }

        .reveal-container {
            position: relative;
            display: inline-block;
            margin-bottom: 1rem;
        }

        .reveal-container .reveal-img {
            margin-bottom: 0;
        }

        .kimbap-canvas {
            position: absolute;
            bottom: 15%;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 120px;
            animation: kimbapFloat 0.8s ease-out 0.3s both;
        }

        @keyframes kimbapFloat {
            0% { opacity: 0; transform: translateX(-50%) translateY(30px) scale(0.5); }
            60% { opacity: 1; transform: translateX(-50%) translateY(-5px) scale(1.05); }
            100% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
        }

        @keyframes revealPop {
            0% { transform: scale(0.3) rotate(-10deg); opacity: 0; }
            60% { transform: scale(1.1) rotate(2deg); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        .kimbap-roll {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        .result-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .result-desc {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 1rem;
            line-height: 1.5;
        }

        .result-ingredients {
            display: flex;
            justify-content: center;
            gap: 0.3rem;
            flex-wrap: wrap;
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .score {
            background: #fff8e0;
            display: inline-block;
            padding: 0.5rem 1.2rem;
            border-radius: 20px;
            font-weight: 700;
            color: #b88600;
            font-size: 0.9rem;
        }

        /* 김밥 컬렉션 */
        .collection {
            width: 100%;
            max-width: 600px;
            margin-top: 2rem;
            border-top: 1px solid #eee;
            padding-top: 1.5rem;
        }

        .collection-title {
            font-size: 0.85rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 1rem;
            font-weight: 600;
        }

        .collection-list {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .collection-item {
            background: #fff;
            border: 1px solid #eee;
            border-radius: 10px;
            padding: 0.6rem 1rem;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .collection-item .mini-ingredients {
            font-size: 1rem;
        }

        /* 말리는 애니메이션 */
        .rolling {
            animation: rollSpin 1s ease-in-out;
        }

        @keyframes rollSpin {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(0.8); }
            100% { transform: rotate(360deg) scale(1); }
        }
    </style>
</head>
<body>
    <a href="/" class="back-link">&larr; Home</a>

    <h1>🍙 김밥 만들기</h1>
    <p class="subtitle">재료를 골라서 나만의 김밥을 말아보세요!</p>

    <div class="game-container">
        <!-- 김밥 조립 영역 -->
        <div class="kimbap-mat">
            <span class="mat-label">김발</span>
            <div class="nori">
                <div class="rice-layer" id="riceLayer">
                    <span class="empty-msg" id="emptyMsg">아래에서 재료를 골라주세요</span>
                </div>
            </div>
        </div>

        <!-- 재료 선택 -->
        <p class="section-title">재료 선택 (최대 3개)</p>
        <div class="ingredients" id="ingredients">
            <button class="ingredient-btn" data-emoji="🫐" data-name="블루베리">
                <span class="emoji">🫐</span>
                <span class="name">블루베리</span>
            </button>
            <button class="ingredient-btn" data-emoji="🍓" data-name="딸기">
                <span class="emoji">🍓</span>
                <span class="name">딸기</span>
            </button>
            <button class="ingredient-btn" data-emoji="🍦" data-name="생크림">
                <span class="emoji">🍦</span>
                <span class="name">생크림</span>
            </button>
            <button class="ingredient-btn" data-emoji="🍣" data-name="연어">
                <span class="emoji">🍣</span>
                <span class="name">연어</span>
            </button>
            <button class="ingredient-btn" data-emoji="🍇" data-name="샤인머스캣">
                <span class="emoji">🍇</span>
                <span class="name">샤인머스캣</span>
            </button>
            <button class="ingredient-btn" data-emoji="🟢" data-name="와사비">
                <span class="emoji">🟢</span>
                <span class="name">와사비</span>
            </button>
            <button class="ingredient-btn" data-emoji="🍍" data-name="파인애플">
                <span class="emoji">🍍</span>
                <span class="name">파인애플</span>
            </button>
            <button class="ingredient-btn" data-emoji="🥓" data-name="햄">
                <span class="emoji">🥓</span>
                <span class="name">햄</span>
            </button>
            <button class="ingredient-btn" data-emoji="🥝" data-name="키위">
                <span class="emoji">🥝</span>
                <span class="name">키위</span>
            </button>
            <button class="ingredient-btn" data-emoji="🐠" data-name="참치">
                <span class="emoji">🐠</span>
                <span class="name">참치</span>
            </button>
        </div>

        <!-- 버튼 -->
        <div class="actions">
            <button class="btn btn-roll" id="rollBtn" disabled>🍳 김밥 말기!</button>
            <button class="btn btn-reset" id="resetBtn">다시 고르기</button>
        </div>

        <!-- 결과 -->
        <div class="result" id="result">
            <div class="reveal-container">
                <img src="reveal.jpeg" alt="김밥 공개!" class="reveal-img">
                <canvas id="kimbapCanvas" width="160" height="160" class="kimbap-canvas"></canvas>
            </div>
            <p class="result-title" id="resultTitle"></p>
            <p class="result-desc" id="resultDesc"></p>
            <div class="result-ingredients" id="resultIngredients"></div>
            <span class="score" id="resultScore"></span>
        </div>
    </div>

    <!-- 컬렉션 -->
    <div class="collection" id="collection" style="display:none;">
        <p class="collection-title">내가 만든 김밥들</p>
        <div class="collection-list" id="collectionList"></div>
    </div>

    <script>
        const riceLayer = document.getElementById('riceLayer');
        const emptyMsg = document.getElementById('emptyMsg');
        const rollBtn = document.getElementById('rollBtn');
        const resetBtn = document.getElementById('resetBtn');
        const result = document.getElementById('result');
        const kimbapRoll = document.getElementById('kimbapRoll');
        const resultTitle = document.getElementById('resultTitle');
        const resultDesc = document.getElementById('resultDesc');
        const resultIngredients = document.getElementById('resultIngredients');
        const resultScore = document.getElementById('resultScore');
        const collection = document.getElementById('collection');
        const collectionList = document.getElementById('collectionList');

        let selected = [];
        const MAX = 3;
        let madeKimbaps = JSON.parse(localStorage.getItem('kimbaps') || '[]');

        // 김밥 이름: 선택한 순서대로 이름 짓기
        function getKimbapName(ingredients) {
            return ingredients.map(i => i.name).join(' ') + ' 김밥';
        }

        function getScore(ingredients) {
            let score = ingredients.length * 25;
            const nameList = ingredients.map(i => i.name);
            // 과일 조합 보너스
            const fruits = ['블루베리', '딸기', '샤인머스캣', '파인애플', '키위'];
            const fruitCount = nameList.filter(n => fruits.includes(n)).length;
            if (fruitCount >= 2) score += 15;
            // 달콤 + 짭짤 조합 보너스
            const sweet = nameList.some(n => [...fruits, '생크림'].includes(n));
            const savory = nameList.some(n => ['연어', '햄', '참치', '와사비'].includes(n));
            if (sweet && savory) score += 20;
            // 랜덤 보너스
            score += Math.floor(Math.random() * 10);
            return Math.min(100, score);
        }

        function getDescription(ingredients, score) {
            if (score >= 90) return '천재적인 조합! 김밥계의 혁명 👨‍🍳';
            if (score >= 70) return '의외로 맛있을 것 같은 조합이에요 😋';
            if (score >= 50) return '호불호가 갈리겠지만... 도전 정신 좋아요 👍';
            return '이건 좀... 용기 있는 선택이네요 🤔';
        }

        // 재료 추가
        document.getElementById('ingredients').addEventListener('click', (e) => {
            const btn = e.target.closest('.ingredient-btn');
            if (!btn || selected.length >= MAX) return;

            const emoji = btn.dataset.emoji;
            const name = btn.dataset.name;
            selected.push({ emoji, name });

            emptyMsg.style.display = 'none';
            const span = document.createElement('span');
            span.className = 'ingredient-on-rice';
            span.textContent = emoji;
            span.title = name;
            span.addEventListener('click', () => removeIngredient(span, name, emoji));
            riceLayer.appendChild(span);

            rollBtn.disabled = selected.length === 0;
        });

        // 재료 제거 (클릭으로)
        function removeIngredient(el, name, emoji) {
            const idx = selected.findIndex(s => s.name === name && s.emoji === emoji);
            if (idx !== -1) selected.splice(idx, 1);
            el.remove();
            if (selected.length === 0) emptyMsg.style.display = '';
            rollBtn.disabled = selected.length === 0;
        }

        // 다시 고르기
        resetBtn.addEventListener('click', () => {
            selected = [];
            riceLayer.querySelectorAll('.ingredient-on-rice').forEach(el => el.remove());
            emptyMsg.style.display = '';
            rollBtn.disabled = true;
            result.classList.remove('show');
        });

        // 김밥 말기
        rollBtn.addEventListener('click', () => {
            if (selected.length === 0) return;

            // 말리는 애니메이션
            const mat = document.querySelector('.kimbap-mat');
            mat.classList.add('rolling');
            setTimeout(() => mat.classList.remove('rolling'), 1000);

            setTimeout(() => {
                const name = getKimbapName(selected);
                const score = getScore(selected);
                const desc = getDescription(selected, score);

                resultTitle.textContent = name;
                resultDesc.textContent = desc;
                resultIngredients.textContent = selected.map(s => s.emoji).join(' ');
                resultScore.textContent = `맛 점수: ${score}점`;
                result.classList.add('show');

                // 컬렉션에 추가
                const kimbap = { name, ingredients: [...selected], score, date: new Date().toLocaleDateString('ko-KR') };
                madeKimbaps.unshift(kimbap);
                if (madeKimbaps.length > 10) madeKimbaps.pop();
                localStorage.setItem('kimbaps', JSON.stringify(madeKimbaps));
                renderCollection();
            }, 800);
        });

        // 컬렉션 렌더링
        function renderCollection() {
            if (madeKimbaps.length === 0) { collection.style.display = 'none'; return; }
            collection.style.display = '';
            collectionList.innerHTML = madeKimbaps.map(k =>
                `<div class="collection-item">
                    <span class="mini-ingredients">${k.ingredients.map(i => i.emoji).join('')}</span>
                    <span>${k.name} (${k.score}점)</span>
                </div>`
            ).join('');
        }
        renderCollection();
    </script>
</body>
</html>
