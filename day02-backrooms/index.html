<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 02 — Backrooms | hyejunmoon</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            overflow: hidden;
            background: #0a0a00;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .back-link {
            position: fixed;
            top: 1.5rem;
            left: 1.5rem;
            color: rgba(200, 180, 100, 0.4);
            text-decoration: none;
            font-size: 0.9rem;
            z-index: 200;
            font-family: monospace;
            transition: color 0.2s;
        }

        .back-link:hover { color: rgba(200, 180, 100, 0.8); }

        .scene {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        .backrooms-img {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 110%;
            min-height: 110%;
            object-fit: cover;
            transform: translate(-50%, -50%);
            transition: transform 0.3s ease-out;
        }

        /* 형광등 깜빡임 오버레이 */
        .light-flicker {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 5;
            background: rgba(180, 170, 80, 0);
            animation: lightFlicker 8s ease-in-out infinite;
        }

        @keyframes lightFlicker {
            0%, 100% { background: rgba(180, 170, 80, 0); }
            4% { background: rgba(0, 0, 0, 0.15); }
            4.5% { background: rgba(180, 170, 80, 0.03); }
            5% { background: rgba(0, 0, 0, 0.1); }
            5.5% { background: rgba(180, 170, 80, 0); }
            50% { background: rgba(180, 170, 80, 0); }
            50.5% { background: rgba(0, 0, 0, 0.08); }
            51% { background: rgba(180, 170, 80, 0.02); }
            51.5% { background: rgba(180, 170, 80, 0); }
        }

        /* 순간 정전 효과 */
        .blackout {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 6;
            background: rgba(0, 0, 0, 0);
            transition: background 0.05s;
        }

        .blackout.active {
            background: rgba(0, 0, 0, 0.7);
        }

        /* 비네팅 */
        .vignette {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            background: radial-gradient(ellipse at center, transparent 30%, rgba(0, 0, 0, 0.6) 100%);
            z-index: 10;
        }

        /* 노이즈 그레인 */
        .noise {
            position: fixed;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            pointer-events: none;
            z-index: 11;
            opacity: 0.04;
            animation: noiseMove 0.5s steps(5) infinite;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        }

        @keyframes noiseMove {
            0% { transform: translate(0, 0); }
            20% { transform: translate(-5%, 5%); }
            40% { transform: translate(5%, -5%); }
            60% { transform: translate(-3%, -3%); }
            80% { transform: translate(3%, 3%); }
            100% { transform: translate(0, 0); }
        }

        /* 스캔라인 */
        .scanlines {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 12;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 0, 0, 0.015) 2px,
                rgba(0, 0, 0, 0.015) 4px
            );
        }

        /* 먼지 파티클 캔버스 */
        #dustCanvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 8;
        }

        /* 앰비언트 텍스트 - 간헐적으로 나타남 */
        .whisper {
            position: fixed;
            font-family: 'Courier New', monospace;
            color: rgba(180, 170, 80, 0);
            font-size: 0.8rem;
            pointer-events: none;
            z-index: 15;
            transition: color 3s ease-in-out;
            letter-spacing: 0.2em;
        }

        .whisper.visible {
            color: rgba(180, 170, 80, 0.25);
        }

        .whisper-1 { bottom: 3rem; left: 3rem; }
        .whisper-2 { top: 3rem; right: 3rem; }

        .info {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            color: rgba(200, 180, 100, 0.25);
            font-family: monospace;
            font-size: 0.7rem;
            z-index: 200;
        }
    </style>
</head>
<body>
    <a href="/" class="back-link">&larr; Home</a>

    <div class="scene">
        <img src="backrooms.png" alt="The Backrooms" class="backrooms-img" id="bgImage">
    </div>

    <div class="light-flicker"></div>
    <div class="blackout" id="blackout"></div>
    <div class="vignette"></div>
    <div class="noise"></div>
    <div class="scanlines"></div>
    <canvas id="dustCanvas"></canvas>

    <div class="whisper whisper-1" id="whisper1">if you're not careful you'll end up here</div>
    <div class="whisper whisper-2" id="whisper2">level 0</div>

    <div class="info">drag to look around</div>

    <script>
        const bgImage = document.getElementById('bgImage');
        const blackout = document.getElementById('blackout');
        const dustCanvas = document.getElementById('dustCanvas');
        const ctx = dustCanvas.getContext('2d');
        const whisper1 = document.getElementById('whisper1');
        const whisper2 = document.getElementById('whisper2');

        let W, H;
        let offsetX = 0, offsetY = 0;
        let isDragging = false;
        let lastMouseX = 0, lastMouseY = 0;

        function resize() {
            W = dustCanvas.width = window.innerWidth;
            H = dustCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // 드래그로 시점 이동
        document.addEventListener('mousedown', (e) => {
            isDragging = true;
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
        });

        document.addEventListener('mouseup', () => { isDragging = false; });

        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const dx = (e.clientX - lastMouseX) * 0.15;
            const dy = (e.clientY - lastMouseY) * 0.15;
            offsetX = Math.max(-60, Math.min(60, offsetX + dx));
            offsetY = Math.max(-30, Math.min(30, offsetY + dy));
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
            bgImage.style.transform = `translate(calc(-50% + ${offsetX}px), calc(-50% + ${offsetY}px))`;
        });

        // 터치 지원
        document.addEventListener('touchstart', (e) => {
            isDragging = true;
            lastMouseX = e.touches[0].clientX;
            lastMouseY = e.touches[0].clientY;
        });
        document.addEventListener('touchend', () => { isDragging = false; });
        document.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            const dx = (e.touches[0].clientX - lastMouseX) * 0.15;
            const dy = (e.touches[0].clientY - lastMouseY) * 0.15;
            offsetX = Math.max(-60, Math.min(60, offsetX + dx));
            offsetY = Math.max(-30, Math.min(30, offsetY + dy));
            lastMouseX = e.touches[0].clientX;
            lastMouseY = e.touches[0].clientY;
            bgImage.style.transform = `translate(calc(-50% + ${offsetX}px), calc(-50% + ${offsetY}px))`;
        });

        // 먼지 파티클
        const dusts = [];
        for (let i = 0; i < 40; i++) {
            dusts.push({
                x: Math.random() * W,
                y: Math.random() * H,
                size: 0.5 + Math.random() * 2,
                speedX: (Math.random() - 0.5) * 0.3,
                speedY: -0.1 - Math.random() * 0.3,
                opacity: 0.1 + Math.random() * 0.3
            });
        }

        function drawDust(time) {
            ctx.clearRect(0, 0, W, H);
            dusts.forEach(d => {
                d.x += d.speedX + Math.sin(time * 0.001 + d.y * 0.01) * 0.2;
                d.y += d.speedY;
                if (d.y < -10) { d.y = H + 10; d.x = Math.random() * W; }
                if (d.x < -10) d.x = W + 10;
                if (d.x > W + 10) d.x = -10;

                ctx.fillStyle = `rgba(200, 190, 130, ${d.opacity})`;
                ctx.beginPath();
                ctx.arc(d.x, d.y, d.size, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        // 랜덤 정전 효과
        function randomBlackout() {
            const next = 5000 + Math.random() * 15000;
            setTimeout(() => {
                blackout.classList.add('active');
                setTimeout(() => {
                    blackout.classList.remove('active');
                    // 가끔 이중 깜빡임
                    if (Math.random() > 0.5) {
                        setTimeout(() => {
                            blackout.classList.add('active');
                            setTimeout(() => blackout.classList.remove('active'), 50);
                        }, 100);
                    }
                }, 50 + Math.random() * 100);
                randomBlackout();
            }, next);
        }
        randomBlackout();

        // 위스퍼 텍스트 간헐적 표시
        function randomWhisper() {
            const next = 8000 + Math.random() * 20000;
            setTimeout(() => {
                const el = Math.random() > 0.5 ? whisper1 : whisper2;
                el.classList.add('visible');
                setTimeout(() => el.classList.remove('visible'), 4000 + Math.random() * 3000);
                randomWhisper();
            }, next);
        }
        randomWhisper();

        // 메인 루프
        function animate(time) {
            drawDust(time);
            requestAnimationFrame(animate);
        }
        animate(0);
    </script>
</body>
</html>
