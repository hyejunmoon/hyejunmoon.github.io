<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hyejunmoon — Daily Works</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0f0f0f;
            color: #e0e0e0;
            min-height: 100vh;
            padding: 4rem 2rem;
        }

        .container {
            max-width: 640px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 4rem;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: #888;
            font-size: 1rem;
        }

        .works {
            list-style: none;
        }

        .works li {
            border-bottom: 1px solid #222;
        }

        .works a {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.25rem 0;
            text-decoration: none;
            color: #e0e0e0;
            transition: color 0.2s, padding-left 0.2s;
        }

        .works a:hover {
            color: #fff;
            padding-left: 0.5rem;
        }

        .work-title {
            font-size: 1.1rem;
            font-weight: 500;
        }

        .work-date {
            font-size: 0.85rem;
            color: #666;
            white-space: nowrap;
            margin-left: 1rem;
        }

        .work-tag {
            display: inline-block;
            font-size: 0.7rem;
            background: #222;
            color: #aaa;
            padding: 0.2rem 0.5rem;
            border-radius: 3px;
            margin-left: 0.5rem;
            vertical-align: middle;
        }

        footer {
            margin-top: 4rem;
            color: #444;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>hyejunmoon</h1>
            <p class="subtitle">매일 하나씩, 만들고 올리기</p>
        </header>

        <ul class="works">
            <li>
                <a href="/day04-vending/">
                    <span class="work-title">Alphabet Vending Machine <span class="work-tag">game</span></span>
                    <span class="work-date">2025.07.24</span>
                </a>
            </li>
            <li>
                <a href="/day03-kimbap/">
                    <span class="work-title">김밥 만들기 게임 <span class="work-tag">game</span></span>
                    <span class="work-date">2025.07.23</span>
                </a>
            </li>
            <li>
                <a href="/day02-backrooms/">
                    <span class="work-title">Backrooms — Generative Art <span class="work-tag">generative</span></span>
                    <span class="work-date">2025.07.22</span>
                </a>
            </li>
            <li>
                <a href="/day01-poster/">
                    <span class="work-title">Interactive Poster <span class="work-tag">animation</span></span>
                    <span class="work-date">2025.07.21</span>
                </a>
            </li>
            <!-- 새 작업물은 여기 위에 추가 -->
        </ul>

        <footer>
            &copy; 2025 hyejunmoon
        </footer>
    </div>
</body>
</html>
