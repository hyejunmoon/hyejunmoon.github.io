<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 01 — Poster | hyejunmoon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #0a0a0a;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            cursor: crosshair;
        }

        .back-link {
            position: fixed;
            top: 1.5rem;
            left: 1.5rem;
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            font-size: 0.9rem;
            z-index: 200;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: #fff;
        }

        .scene {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1000px;
        }

        .poster-wrapper {
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
        }

        .poster {
            width: auto;
            height: 85vh;
            max-width: 90vw;
            object-fit: contain;
            border-radius: 4px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
            transition: box-shadow 0.3s ease;
        }

        .poster-wrapper:hover .poster {
            box-shadow: 0 40px 100px rgba(255, 100, 200, 0.3),
                        0 20px 60px rgba(100, 255, 100, 0.2);
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            animation: float 8s ease-in-out infinite;
            pointer-events: none;
        }

        .blob-1 { width: 400px; height: 400px; background: #ff00ff; top: 10%; left: 10%; animation-delay: 0s; }
        .blob-2 { width: 350px; height: 350px; background: #00ff88; bottom: 10%; right: 10%; animation-delay: -3s; }
        .blob-3 { width: 300px; height: 300px; background: #ffaa00; top: 50%; left: 50%; transform: translate(-50%, -50%); animation-delay: -5s; }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(30px, -40px) scale(1.1); }
            50% { transform: translate(-20px, 20px) scale(0.95); }
            75% { transform: translate(40px, 30px) scale(1.05); }
        }

        .floating-text {
            position: absolute;
            color: #fff;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            opacity: 0.7;
            pointer-events: none;
            animation: drift 12s ease-in-out infinite;
        }

        .text-1 { font-size: clamp(1rem, 3vw, 2.5rem); top: 5%; left: 5%; animation-delay: 0s; }
        .text-2 { font-size: clamp(0.8rem, 2vw, 1.5rem); bottom: 8%; right: 5%; animation-delay: -4s; }
        .text-3 { font-size: clamp(0.8rem, 2vw, 1.5rem); top: 8%; right: 5%; animation-delay: -7s; }

        @keyframes drift {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(10px, -10px) rotate(1deg); }
            66% { transform: translate(-10px, 5px) rotate(-1deg); }
        }

        .cursor-glow {
            position: fixed;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 0, 255, 0.15) 0%, transparent 70%);
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 100;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            pointer-events: none;
            animation: sparkle 3s ease-out forwards;
        }

        @keyframes sparkle {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(0) translateY(-100px); opacity: 0; }
        }

        .scanlines {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px);
            z-index: 50;
        }

        @keyframes glitch {
            0%, 95%, 100% { transform: translate(0); filter: none; }
            96% { transform: translate(-2px, 1px); filter: hue-rotate(90deg); }
            97% { transform: translate(2px, -1px); filter: hue-rotate(180deg); }
            98% { transform: translate(-1px, -1px); filter: hue-rotate(270deg); }
        }

        .poster-wrapper.glitch .poster {
            animation: glitch 4s ease-in-out infinite;
        }
    </style>
</head>
<body>
    <a href="/" class="back-link">&larr; Home</a>

    <div class="scene">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>

        <div class="poster-wrapper" id="posterWrapper">
            <img src="poster.png" alt="CARNESTOLTES YEAH! CLUB Poster" class="poster">
        </div>

        <div class="floating-text text-1">CARNESTOLTES</div>
        <div class="floating-text text-2">FEBRER 2026 — GIRONA</div>
        <div class="floating-text text-3">YEAH! CLUB</div>
    </div>

    <div class="cursor-glow" id="cursorGlow"></div>
    <div class="scanlines"></div>

    <script>
        const wrapper = document.getElementById('posterWrapper');
        const cursorGlow = document.getElementById('cursorGlow');
        let mouseX = 0, mouseY = 0, currentX = 0, currentY = 0;

        document.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
            mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
            cursorGlow.style.left = e.clientX + 'px';
            cursorGlow.style.top = e.clientY + 'px';
        });

        function animate() {
            currentX += (mouseX - currentX) * 0.08;
            currentY += (mouseY - currentY) * 0.08;
            wrapper.style.transform = `rotateY(${currentX * 15}deg) rotateX(${-currentY * 10}deg)`;
            requestAnimationFrame(animate);
        }
        animate();

        document.addEventListener('click', (e) => {
            const colors = ['#ff00ff', '#00ff88', '#ffaa00', '#ff6699', '#66ffcc'];
            for (let i = 0; i < 12; i++) {
                const p = document.createElement('div');
                p.classList.add('particle');
                p.style.left = e.clientX + 'px';
                p.style.top = e.clientY + 'px';
                p.style.background = colors[Math.floor(Math.random() * colors.length)];
                p.style.transform = `translate(${(Math.random()-0.5)*200}px, ${(Math.random()-0.5)*200}px)`;
                p.style.animationDuration = (1 + Math.random() * 2) + 's';
                document.body.appendChild(p);
                setTimeout(() => p.remove(), 3000);
            }
            wrapper.classList.add('glitch');
            setTimeout(() => wrapper.classList.remove('glitch'), 500);
        });

        if (window.DeviceOrientationEvent) {
            window.addEventListener('deviceorientation', (e) => {
                if (e.gamma !== null && e.beta !== null) {
                    mouseX = e.gamma / 45;
                    mouseY = (e.beta - 45) / 45;
                }
            });
        }
    </script>
</body>
</html>
