<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Day 05 — Make Iced Americano | hyejunmoon</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            overflow: hidden;
            background: #1a1a1a;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: #fff;
            touch-action: none;
        }

        .back-link {
            position: fixed;
            top: 1rem;
            left: 1rem;
            color: rgba(255,255,255,0.4);
            text-decoration: none;
            font-size: 0.85rem;
            z-index: 200;
        }

        #threeCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        /* 단계 표시 */
        .step-indicator {
            position: fixed;
            top: 1.5rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 0.5rem;
            z-index: 200;
        }

        .step-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #333;
            transition: all 0.3s;
        }

        .step-dot.done { background: #00704a; }
        .step-dot.active { background: #fff; box-shadow: 0 0 8px #fff; }

        /* 지시 텍스트 */
        .instruction {
            position: fixed;
            top: 4rem;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 200;
            width: 90%;
        }

        .instruction-text {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 0.3rem;
        }

        .instruction-sub {
            font-size: 0.8rem;
            color: #888;
        }

        /* 진행 바 */
        .progress-bar {
            position: fixed;
            bottom: 3rem;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            height: 6px;
            background: #333;
            border-radius: 3px;
            overflow: hidden;
            z-index: 200;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            border-radius: 3px;
            transition: width 0.1s, background 0.3s;
            background: #fff;
        }

        /* 완료 화면 */
        .complete {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            background: rgba(0,0,0,0.8);
            z-index: 300;
        }

        .complete.show { display: flex; }
        .complete-emoji { font-size: 4rem; margin-bottom: 1rem; }
        .complete-text { font-size: 1.3rem; font-weight: 700; margin-bottom: 0.5rem; }
        .complete-sub { font-size: 0.9rem; color: #888; margin-bottom: 2rem; }

        .restart-btn {
            background: #00704a;
            color: #fff;
            border: none;
            padding: 0.8rem 2rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }

        /* 시작 화면 */
        .start-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            background: #1a1a1a;
            z-index: 500;
        }

        .start-screen.hidden { display: none; }
        .start-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
        .start-sub { font-size: 0.9rem; color: #888; margin-bottom: 2rem; text-align: center; line-height: 1.6; padding: 0 2rem; }
        .start-tap { font-size: 1rem; color: #00704a; animation: fadeInOut 2s ease-in-out infinite; }

        @keyframes fadeInOut {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        /* 데스크탑 안내 */
        .desktop-notice {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #1a1a1a;
            z-index: 9999;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            text-align: center;
            padding: 2rem;
        }

        .desktop-notice .notice-emoji { font-size: 4rem; margin-bottom: 1rem; }
        .desktop-notice .notice-title { font-size: 1.3rem; font-weight: 700; margin-bottom: 0.5rem; }
        .desktop-notice .notice-desc { font-size: 1rem; color: #888; line-height: 1.6; margin-bottom: 1.5rem; }
        .desktop-notice .notice-url { font-size: 0.85rem; color: #00704a; background: #1a2e1a; padding: 0.5rem 1rem; border-radius: 8px; }

        @media (hover: hover) and (pointer: fine) {
            .desktop-notice { display: flex; }
        }
    </style>
</head>
<body>
    <a href="/" class="back-link">&larr; Home</a>

    <!-- 데스크탑 안내 -->
    <div class="desktop-notice">
        <p class="notice-emoji">📱</p>
        <p class="notice-title">모바일 전용 페이지입니다</p>
        <p class="notice-desc">스마트폰으로 접속해서<br>기울이고 흔들어 보세요!</p>
        <p class="notice-url">hyejunmoon.github.io/day05-coffee</p>
    </div>

    <!-- 시작 화면 -->
    <div class="start-screen" id="startScreen">
        <p class="start-title">☕ Iced Americano</p>
        <p class="start-sub">
            1. 오른쪽으로 기울이기 → 에스프레소 샷<br>
            2. 위아래로 흔들기 → 얼음 추가<br>
            3. 왼쪽으로 기울이기 → 물 채우기
        </p>
        <p class="start-tap">화면을 터치하여 시작</p>
    </div>

    <!-- UI 오버레이 -->
    <div class="step-indicator">
        <div class="step-dot active" id="dot1"></div>
        <div class="step-dot" id="dot2"></div>
        <div class="step-dot" id="dot3"></div>
    </div>

    <div class="instruction">
        <p class="instruction-text" id="instrText">오른쪽으로 기울이세요</p>
        <p class="instruction-sub" id="instrSub">에스프레소 샷 추출</p>
    </div>

    <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
    </div>

    <!-- 완료 -->
    <div class="complete" id="completeScreen">
        <p class="complete-emoji">☕</p>
        <p class="complete-text">아이스 아메리카노 완성!</p>
        <p class="complete-sub">당신의 커피가 준비되었습니다</p>
        <button class="restart-btn" id="restartBtn">다시 만들기</button>
    </div>

    <!-- Three.js -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
        import { MTLLoader } from 'three/addons/loaders/MTLLoader.js';

        // Three.js 씬 설정
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 2, 5);
        camera.lookAt(0, 0.8, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.body.insertBefore(renderer.domElement, document.body.firstChild);

        // 조명
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
        dirLight.position.set(3, 5, 3);
        scene.add(dirLight);

        const backLight = new THREE.DirectionalLight(0x88aaff, 0.3);
        backLight.position.set(-2, 3, -3);
        scene.add(backLight);

        // 바닥 (반사면)
        const floorGeo = new THREE.PlaneGeometry(10, 10);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.8, roughness: 0.3 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -0.01;
        scene.add(floor);

        // 3D 유리잔 로드
        let glassModel = null;
        const loader = new GLTFLoader();
        loader.load('glass.glb', (gltf) => {
            glassModel = gltf.scene;
            glassModel.scale.set(0.4, 0.4, 0.4);
            glassModel.position.set(0, 0, 0);

            // 유리 재질 적용
            glassModel.traverse((child) => {
                if (child.isMesh) {
                    child.material = new THREE.MeshPhysicalMaterial({
                        color: 0xffffff,
                        metalness: 0,
                        roughness: 0.05,
                        transmission: 0.9,
                        thickness: 0.5,
                        ior: 1.5,
                        transparent: true,
                        opacity: 0.3,
                    });
                }
            });

            scene.add(glassModel);
        });

        // 커피 액체 (에스프레소)
        const espressoGeo = new THREE.CylinderGeometry(0.35, 0.3, 0, 32);
        const espressoMat = new THREE.MeshStandardMaterial({
            color: 0x3d1f0a,
            metalness: 0.1,
            roughness: 0.4,
            transparent: true,
            opacity: 0.9,
        });
        const espressoMesh = new THREE.Mesh(espressoGeo, espressoMat);
        espressoMesh.position.set(0, 0.05, 0);
        scene.add(espressoMesh);

        // 물
        const waterGeo = new THREE.CylinderGeometry(0.35, 0.3, 0, 32);
        const waterMat = new THREE.MeshPhysicalMaterial({
            color: 0x8ec8e8,
            metalness: 0,
            roughness: 0.1,
            transmission: 0.6,
            transparent: true,
            opacity: 0.4,
        });
        const waterMesh = new THREE.Mesh(waterGeo, waterMat);
        waterMesh.position.set(0, 0.05, 0);
        scene.add(waterMesh);

        // 얼음 큐브들 (OBJ 모델)
        const iceCubes = [];
        const icePositions = [
            { x: -0.1, y: 0.8, z: 0.1, rx: 0.3, ry: 0.5 },
            { x: 0.12, y: 0.9, z: -0.05, rx: 0.7, ry: 0.2 },
            { x: 0, y: 1.0, z: 0.12, rx: 0.1, ry: 0.8 },
            { x: -0.08, y: 1.1, z: -0.1, rx: 0.5, ry: 0.4 },
        ];

        const mtlLoader = new MTLLoader();
        mtlLoader.load('icecube.mtl', (materials) => {
            materials.preload();
            const objLoader = new OBJLoader();
            objLoader.setMaterials(materials);
            objLoader.load('icecube.obj', (obj) => {
                // 얼음 재질을 반투명으로 덮어쓰기
                obj.traverse((child) => {
                    if (child.isMesh) {
                        child.material = new THREE.MeshPhysicalMaterial({
                            color: 0xd4f1f9,
                            metalness: 0,
                            roughness: 0.1,
                            transmission: 0.7,
                            transparent: true,
                            opacity: 0.6,
                        });
                    }
                });

                icePositions.forEach(pos => {
                    const clone = obj.clone();
                    clone.scale.set(0.15, 0.15, 0.15);
                    clone.position.set(pos.x, pos.y, pos.z);
                    clone.rotation.set(pos.rx, pos.ry, 0);
                    clone.visible = false;
                    scene.add(clone);
                    iceCubes.push(clone);
                });
            });
        });

        // 게임 로직
        const startScreen = document.getElementById('startScreen');
        const instrText = document.getElementById('instrText');
        const instrSub = document.getElementById('instrSub');
        const progressFill = document.getElementById('progressFill');
        const completeScreen = document.getElementById('completeScreen');
        const restartBtn = document.getElementById('restartBtn');
        const dots = [document.getElementById('dot1'), document.getElementById('dot2'), document.getElementById('dot3')];

        let currentStep = 0;
        let progress = 0;
        let gamma = 0;
        let shakeCount = 0;
        let lastShakeTime = 0;
        let prevAccel = 0;
        let gameStarted = false;

        startScreen.addEventListener('click', async () => {
            if (typeof DeviceOrientationEvent !== 'undefined' &&
                typeof DeviceOrientationEvent.requestPermission === 'function') {
                const response = await DeviceOrientationEvent.requestPermission();
                if (response !== 'granted') return;
            }

            window.addEventListener('deviceorientation', (e) => {
                gamma = e.gamma || 0;
            });

            window.addEventListener('devicemotion', (e) => {
                const accel = e.accelerationIncludingGravity;
                if (!accel) return;
                const total = Math.abs(accel.x) + Math.abs(accel.y) + Math.abs(accel.z);
                const delta = Math.abs(total - prevAccel);
                prevAccel = total;

                if (delta > 15 && Date.now() - lastShakeTime > 300) {
                    lastShakeTime = Date.now();
                    if (currentStep === 1) {
                        shakeCount++;
                        progress = Math.min(1, shakeCount / 8);
                    }
                }
            });

            startScreen.classList.add('hidden');
            gameStarted = true;
        });

        function updateGame() {
            if (!gameStarted) return;

            if (currentStep === 0) {
                if (gamma > 25) {
                    progress = Math.min(1, progress + 0.005);
                } else {
                    progress = Math.max(0, progress - 0.002);
                }
                // 에스프레소 높이 업데이트
                const h = progress * 0.5;
                espressoMesh.geometry.dispose();
                espressoMesh.geometry = new THREE.CylinderGeometry(0.35, 0.3, h, 32);
                espressoMesh.position.y = h / 2 + 0.05;

                if (progress >= 1) nextStep();
            } else if (currentStep === 1) {
                const iceCount = Math.floor(progress * 4);
                iceCubes.forEach((cube, i) => { cube.visible = i < iceCount; });
                if (progress >= 1) nextStep();
            } else if (currentStep === 2) {
                if (gamma < -25) {
                    progress = Math.min(1, progress + 0.004);
                } else {
                    progress = Math.max(0, progress - 0.001);
                }
                // 물 높이 업데이트
                const wh = progress * 1.2;
                waterMesh.geometry.dispose();
                waterMesh.geometry = new THREE.CylinderGeometry(0.35, 0.3, wh, 32);
                waterMesh.position.y = wh / 2 + 0.05;

                if (progress >= 1) completeGame();
            }

            progressFill.style.width = (progress * 100) + '%';
            if (currentStep === 0) progressFill.style.background = '#5c3317';
            else if (currentStep === 1) progressFill.style.background = '#a8d8ea';
            else progressFill.style.background = '#87ceeb';
        }

        function nextStep() {
            currentStep++;
            progress = 0;
            shakeCount = 0;
            progressFill.style.width = '0%';

            dots.forEach((dot, i) => {
                dot.classList.remove('active', 'done');
                if (i < currentStep) dot.classList.add('done');
                if (i === currentStep) dot.classList.add('active');
            });

            if (currentStep === 1) {
                instrText.textContent = '위아래로 흔드세요';
                instrSub.textContent = '얼음 추가';
            } else if (currentStep === 2) {
                instrText.textContent = '왼쪽으로 기울이세요';
                instrSub.textContent = '물 채우기';
            }
        }

        function completeGame() {
            gameStarted = false;
            completeScreen.classList.add('show');
        }

        restartBtn.addEventListener('click', () => {
            currentStep = 0;
            progress = 0;
            shakeCount = 0;
            gameStarted = true;

            espressoMesh.geometry.dispose();
            espressoMesh.geometry = new THREE.CylinderGeometry(0.35, 0.3, 0, 32);
            waterMesh.geometry.dispose();
            waterMesh.geometry = new THREE.CylinderGeometry(0.35, 0.3, 0, 32);
            iceCubes.forEach(c => { c.visible = false; });
            progressFill.style.width = '0%';
            completeScreen.classList.remove('show');

            dots.forEach((dot, i) => {
                dot.classList.remove('active', 'done');
                if (i === 0) dot.classList.add('active');
            });
            instrText.textContent = '오른쪽으로 기울이세요';
            instrSub.textContent = '에스프레소 샷 추출';
        });

        // 렌더 루프
        function animate() {
            requestAnimationFrame(animate);
            updateGame();

            // 잔 기울기 반영 (미세하게)
            if (glassModel) {
                const targetRotZ = -gamma * 0.005;
                glassModel.rotation.z += (targetRotZ - glassModel.rotation.z) * 0.1;
            }

            renderer.render(scene, camera);
        }

        // 리사이즈
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
