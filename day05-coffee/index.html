<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Day 05 — Make Iced Americano | hyejunmoon</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            overflow: hidden;
            background: #1a1a1a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: #fff;
            touch-action: none;
        }

        .back-link {
            position: fixed;
            top: 1rem;
            left: 1rem;
            color: rgba(255,255,255,0.4);
            text-decoration: none;
            font-size: 0.85rem;
            z-index: 200;
        }

        /* 단계 표시 */
        .step-indicator {
            position: fixed;
            top: 1.5rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 0.5rem;
            z-index: 200;
        }

        .step-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #333;
            transition: all 0.3s;
        }

        .step-dot.done { background: #00704a; }
        .step-dot.active { background: #fff; box-shadow: 0 0 8px #fff; }

        /* 지시 텍스트 */
        .instruction {
            position: fixed;
            top: 4rem;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 200;
            width: 90%;
        }

        .instruction-text {
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 0.3rem;
        }

        .instruction-sub {
            font-size: 0.8rem;
            color: #888;
        }

        /* 진행 바 */
        .progress-bar {
            position: fixed;
            bottom: 3rem;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            height: 6px;
            background: #333;
            border-radius: 3px;
            overflow: hidden;
            z-index: 200;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            border-radius: 3px;
            transition: width 0.1s, background 0.3s;
            background: #fff;
        }

        /* 유리잔 */
        .glass-container {
            position: relative;
            width: 140px;
            height: 280px;
        }

        .glass {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 240px;
            border: 3px solid rgba(200, 220, 255, 0.4);
            border-top: none;
            border-radius: 0 0 12px 12px;
            overflow: hidden;
            background: rgba(200, 220, 255, 0.05);
            box-shadow: inset 0 0 30px rgba(200, 220, 255, 0.03),
                        0 10px 40px rgba(0,0,0,0.3);
        }

        .glass::before {
            content: '';
            position: absolute;
            top: 0;
            left: -3px;
            right: -3px;
            height: 3px;
            background: rgba(200, 220, 255, 0.3);
            border-radius: 3px;
        }

        /* 유리 하이라이트 */
        .glass-highlight {
            position: absolute;
            top: 10%;
            left: 8%;
            width: 3px;
            height: 60%;
            background: linear-gradient(180deg, rgba(255,255,255,0.2), transparent);
            border-radius: 2px;
        }

        /* 액체 레이어들 */
        .liquid-layer {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            transition: height 0.3s ease-out;
        }

        #waterLayer {
            background: linear-gradient(180deg, rgba(180, 210, 240, 0.4), rgba(150, 190, 220, 0.5));
            height: 0%;
            z-index: 1;
        }

        #espressoLayer {
            background: linear-gradient(180deg, rgba(80, 40, 10, 0.9), rgba(50, 25, 5, 0.95));
            height: 0%;
            z-index: 2;
        }

        /* 얼음 */
        .ice {
            position: absolute;
            background: rgba(200, 230, 255, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 4px;
            z-index: 3;
            opacity: 0;
            transition: opacity 0.5s;
        }

        .ice.visible { opacity: 1; }

        .ice-1 { width: 22px; height: 20px; left: 20%; bottom: 45%; transform: rotate(5deg); }
        .ice-2 { width: 18px; height: 22px; left: 55%; bottom: 50%; transform: rotate(-8deg); }
        .ice-3 { width: 20px; height: 18px; left: 35%; bottom: 60%; transform: rotate(12deg); }
        .ice-4 { width: 16px; height: 20px; left: 65%; bottom: 35%; transform: rotate(-3deg); }

        /* 완료 화면 */
        .complete {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            background: rgba(0,0,0,0.8);
            z-index: 300;
            animation: fadeIn 0.5s ease;
        }

        .complete.show { display: flex; }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .complete-emoji { font-size: 4rem; margin-bottom: 1rem; }
        .complete-text { font-size: 1.3rem; font-weight: 700; margin-bottom: 0.5rem; }
        .complete-sub { font-size: 0.9rem; color: #888; margin-bottom: 2rem; }

        .restart-btn {
            background: #00704a;
            color: #fff;
            border: none;
            padding: 0.8rem 2rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }

        /* 시작 화면 - 터치하여 시작 */
        .start-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            background: #1a1a1a;
            z-index: 500;
        }

        .start-screen.hidden { display: none; }

        .start-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
        .start-sub { font-size: 0.9rem; color: #888; margin-bottom: 2rem; text-align: center; line-height: 1.6; padding: 0 2rem; }
        .start-tap { font-size: 1rem; color: #00704a; animation: fadeInOut 2s ease-in-out infinite; }

        @keyframes fadeInOut {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        /* 데스크탑 안내 */
        .desktop-notice {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #1a1a1a;
            z-index: 9999;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            text-align: center;
            padding: 2rem;
        }

        .desktop-notice .notice-emoji { font-size: 4rem; margin-bottom: 1rem; }
        .desktop-notice .notice-title { font-size: 1.3rem; font-weight: 700; margin-bottom: 0.5rem; }
        .desktop-notice .notice-desc { font-size: 1rem; color: #888; line-height: 1.6; margin-bottom: 1.5rem; }
        .desktop-notice .notice-url { font-size: 0.85rem; color: #00704a; background: #1a2e1a; padding: 0.5rem 1rem; border-radius: 8px; }

        @media (hover: hover) and (pointer: fine) {
            .desktop-notice { display: flex; }
        }
    </style>
</head>
<body>
    <a href="/" class="back-link">&larr; Home</a>

    <!-- 데스크탑 안내 -->
    <div class="desktop-notice">
        <p class="notice-emoji">📱</p>
        <p class="notice-title">모바일 전용 페이지입니다</p>
        <p class="notice-desc">스마트폰으로 접속해서<br>기울이고 흔들어 보세요!</p>
        <p class="notice-url">hyejunmoon.github.io/day05-coffee</p>
    </div>

    <!-- 시작 화면 -->
    <div class="start-screen" id="startScreen">
        <p class="start-title">☕ Iced Americano</p>
        <p class="start-sub">
            1. 오른쪽으로 기울이기 → 에스프레소 샷<br>
            2. 위아래로 흔들기 → 얼음 추가<br>
            3. 왼쪽으로 기울이기 → 물 채우기
        </p>
        <p class="start-tap">화면을 터치하여 시작</p>
    </div>

    <!-- 단계 표시 -->
    <div class="step-indicator">
        <div class="step-dot active" id="dot1"></div>
        <div class="step-dot" id="dot2"></div>
        <div class="step-dot" id="dot3"></div>
    </div>

    <!-- 지시 -->
    <div class="instruction">
        <p class="instruction-text" id="instrText">오른쪽으로 기울이세요</p>
        <p class="instruction-sub" id="instrSub">에스프레소 샷 추출</p>
    </div>

    <!-- 유리잔 -->
    <div class="glass-container">
        <div class="glass">
            <div class="glass-highlight"></div>
            <div class="liquid-layer" id="waterLayer"></div>
            <div class="liquid-layer" id="espressoLayer"></div>
            <div class="ice ice-1" id="ice1"></div>
            <div class="ice ice-2" id="ice2"></div>
            <div class="ice ice-3" id="ice3"></div>
            <div class="ice ice-4" id="ice4"></div>
        </div>
    </div>

    <!-- 진행 바 -->
    <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
    </div>

    <!-- 완료 화면 -->
    <div class="complete" id="completeScreen">
        <p class="complete-emoji">☕</p>
        <p class="complete-text">아이스 아메리카노 완성!</p>
        <p class="complete-sub">당신의 커피가 준비되었습니다</p>
        <button class="restart-btn" id="restartBtn">다시 만들기</button>
    </div>

    <script>
        const startScreen = document.getElementById('startScreen');
        const instrText = document.getElementById('instrText');
        const instrSub = document.getElementById('instrSub');
        const progressFill = document.getElementById('progressFill');
        const espressoLayer = document.getElementById('espressoLayer');
        const waterLayer = document.getElementById('waterLayer');
        const completeScreen = document.getElementById('completeScreen');
        const restartBtn = document.getElementById('restartBtn');
        const dots = [document.getElementById('dot1'), document.getElementById('dot2'), document.getElementById('dot3')];
        const ices = [document.getElementById('ice1'), document.getElementById('ice2'), document.getElementById('ice3'), document.getElementById('ice4')];

        let currentStep = 0; // 0: espresso, 1: ice, 2: water
        let progress = 0;
        let gamma = 0, beta = 0;
        let lastShakeTime = 0;
        let shakeCount = 0;
        let prevAccel = 0;
        let gameStarted = false;

        // iOS 자이로 권한 + 게임 시작
        startScreen.addEventListener('click', async () => {
            if (typeof DeviceOrientationEvent !== 'undefined' &&
                typeof DeviceOrientationEvent.requestPermission === 'function') {
                const response = await DeviceOrientationEvent.requestPermission();
                if (response === 'granted') {
                    enableSensors();
                }
            } else {
                enableSensors();
            }
            startScreen.classList.add('hidden');
            gameStarted = true;
        });

        function enableSensors() {
            window.addEventListener('deviceorientation', (e) => {
                gamma = e.gamma || 0; // 좌우 기울기 (-90 ~ 90)
                beta = e.beta || 0;   // 앞뒤 기울기
            });

            window.addEventListener('devicemotion', (e) => {
                const accel = e.accelerationIncludingGravity;
                if (!accel) return;
                const totalAccel = Math.abs(accel.x) + Math.abs(accel.y) + Math.abs(accel.z);
                const delta = Math.abs(totalAccel - prevAccel);
                prevAccel = totalAccel;

                if (delta > 15 && Date.now() - lastShakeTime > 300) {
                    lastShakeTime = Date.now();
                    if (currentStep === 1) {
                        shakeCount++;
                        progress = Math.min(1, shakeCount / 8);
                        updateProgress();
                    }
                }
            });
        }

        // 게임 루프
        function gameLoop() {
            if (!gameStarted) {
                requestAnimationFrame(gameLoop);
                return;
            }

            if (currentStep === 0) {
                // 에스프레소: 오른쪽 기울이기 (gamma > 25)
                if (gamma > 25) {
                    progress = Math.min(1, progress + 0.005);
                } else {
                    // 기울이지 않으면 약간 감소 (유지해야 함)
                    progress = Math.max(0, progress - 0.002);
                }
                espressoLayer.style.height = (progress * 25) + '%';
                updateProgress();

                if (progress >= 1) {
                    nextStep();
                }
            } else if (currentStep === 1) {
                // 얼음: 흔들기 (devicemotion에서 처리)
                const iceCount = Math.floor(progress * 4);
                ices.forEach((ice, i) => {
                    if (i < iceCount) ice.classList.add('visible');
                });

                if (progress >= 1) {
                    nextStep();
                }
            } else if (currentStep === 2) {
                // 물: 왼쪽 기울이기 (gamma < -25)
                if (gamma < -25) {
                    progress = Math.min(1, progress + 0.004);
                } else {
                    progress = Math.max(0, progress - 0.001);
                }
                waterLayer.style.height = (25 + progress * 55) + '%';
                updateProgress();

                if (progress >= 1) {
                    completeGame();
                }
            }

            requestAnimationFrame(gameLoop);
        }

        function updateProgress() {
            progressFill.style.width = (progress * 100) + '%';

            // 색상 변경
            if (currentStep === 0) progressFill.style.background = '#5c3317';
            else if (currentStep === 1) progressFill.style.background = '#a8d8ea';
            else progressFill.style.background = '#87ceeb';
        }

        function nextStep() {
            currentStep++;
            progress = 0;
            shakeCount = 0;
            progressFill.style.width = '0%';

            dots.forEach((dot, i) => {
                dot.classList.remove('active', 'done');
                if (i < currentStep) dot.classList.add('done');
                if (i === currentStep) dot.classList.add('active');
            });

            if (currentStep === 1) {
                instrText.textContent = '위아래로 흔드세요';
                instrSub.textContent = '얼음 추가';
            } else if (currentStep === 2) {
                instrText.textContent = '왼쪽으로 기울이세요';
                instrSub.textContent = '물 채우기';
            }
        }

        function completeGame() {
            gameStarted = false;
            completeScreen.classList.add('show');
        }

        // 다시 만들기
        restartBtn.addEventListener('click', () => {
            currentStep = 0;
            progress = 0;
            shakeCount = 0;
            gameStarted = true;

            espressoLayer.style.height = '0%';
            waterLayer.style.height = '0%';
            ices.forEach(ice => ice.classList.remove('visible'));
            progressFill.style.width = '0%';
            completeScreen.classList.remove('show');

            dots.forEach((dot, i) => {
                dot.classList.remove('active', 'done');
                if (i === 0) dot.classList.add('active');
            });

            instrText.textContent = '오른쪽으로 기울이세요';
            instrSub.textContent = '에스프레소 샷 추출';
        });

        gameLoop();
    </script>
</body>
</html>
